[package]
name = "mdcat"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Readable Markdown in your terminal, with styled text and syntax highlighting"
license = "MIT"
repository = "https://github.com/corywilkerson/mdcat"
publish = false
keywords = ["markdown", "terminal", "cli", "syntax-highlighting"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src/**", "/tests/**", "/examples/**", "/scripts/**", "/README.md", "/CHANGELOG.md", "/LICENSE", "/Cargo.lock"]

[dependencies]
pulldown-cmark = "0.10"
crossterm = "0.27"
syntect = "5.2"
textwrap = "0.16"

[profile.release]
strip = true
lto = true
